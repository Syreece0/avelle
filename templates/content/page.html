{% extends "base.html" %}
{% block title %}{{ page.title }} · AVELLE{% endblock %}
{% block content %}
<article class="section">
  <div class="container container--narrow">
    <span class="eyebrow">AVELLE</span>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="lead">{{ page.subtitle }}</p>{% endif %}
    <hr class="rule rule--gold">
    <div class="prose">{{ page.body|linebreaks }}</div>
    {% if not page.body %}<p class="muted">This page is being prepared.</p>{% endif %}
  </div>
</article>
{% endblock %}
