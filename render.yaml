# Render Blueprint: web service + daily cron job. The PostgreSQL database already exists, so it is
# referenced through DATABASE_URL (set in the dashboard) instead of being created here.
services:
  - type: web
    name: avelle
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 180 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: SITE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: cron
    name: avelle-expire-unpaid
    runtime: python
    plan: starter
    schedule: "0 3 * * *"   # 03:00 UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_unpaid_orders
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - fromService: {type: web, name: avelle, envVarKey: DJANGO_SECRET_KEY}
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
